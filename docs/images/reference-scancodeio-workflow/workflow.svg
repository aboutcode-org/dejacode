<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title">
  <title id="title">ScanCode.io detects, DejaCode decides</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="740" height="260" rx="10" fill="#ffffff"/>

  <rect x="6" y="20" width="136" height="220" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="176" y="20" width="180" height="220" rx="8" fill="#f4f5f7" stroke="#2c303a" stroke-width="1.5"/>
  <path d="M 176 60 V 28 Q 176 20 184 20 H 348 Q 356 20 356 28 V 60 Z" fill="#2c303a"/>
  <rect x="556" y="20" width="178" height="220" rx="8" fill="#eef2f9" stroke="#4b70aa" stroke-width="1.5"/>
  <path d="M 556 60 V 28 Q 556 20 564 20 H 726 Q 734 20 734 28 V 60 Z" fill="#4b70aa"/>

  <g font-size="16" font-weight="600" text-anchor="middle">
    <text x="74" y="46" fill="#0f172a">Your code</text>
    <text x="266" y="46" fill="#ffffff">ScanCode<tspan fill="#f7bf3c">.</tspan>io</text>
    <text x="645" y="46" fill="#ffffff">DejaCode</text>
  </g>

  <g font-size="11" font-weight="700" letter-spacing="1.2">
    <text x="20" y="84" fill="#64748b">INPUTS</text>
    <text x="194" y="84" fill="#2c303a">DETECTS</text>
    <text x="574" y="84" fill="#4b70aa">DECIDES</text>
  </g>

  <g font-size="13" fill="#0f172a">
    <circle cx="23" cy="105" r="2.5" fill="#94a3b8"/>
    <text x="32" y="109">Codebase</text>
    <circle cx="23" cy="127" r="2.5" fill="#94a3b8"/>
    <text x="32" y="131">Container image</text>
    <circle cx="23" cy="149" r="2.5" fill="#94a3b8"/>
    <text x="32" y="153">Manifests</text>
    <circle cx="23" cy="171" r="2.5" fill="#94a3b8"/>
    <text x="32" y="175">SBOM</text>

    <circle cx="197" cy="105" r="3" fill="#f7bf3c"/>
    <text x="206" y="109">Packages</text>
    <circle cx="197" cy="127" r="3" fill="#f7bf3c"/>
    <text x="206" y="131">Licenses</text>
    <circle cx="197" cy="149" r="3" fill="#f7bf3c"/>
    <text x="206" y="153">Copyrights</text>
    <circle cx="197" cy="171" r="3" fill="#f7bf3c"/>
    <text x="206" y="175">Dependencies</text>
    <circle cx="197" cy="193" r="3" fill="#f7bf3c"/>
    <text x="206" y="197">Vulnerabilities</text>
    <circle cx="197" cy="215" r="3" fill="#f7bf3c"/>
    <text x="206" y="219">Reachability</text>

    <text x="600" y="110">Review</text>
    <text x="600" y="137">Deliver</text>
    <text x="600" y="164">Maintain</text>
  </g>

  <g stroke="#334155" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="144" y1="130" x2="173" y2="130"/>
    <line x1="554" y1="95" x2="359" y2="95" stroke-dasharray="5 4"/>
    <line x1="358" y1="140" x2="553" y2="140"/>
    <line x1="553" y1="185" x2="359" y2="185" marker-start="url(#arrow)"/>
  </g>

  <g fill="#334155" font-size="12">
    <text x="420" y="86">License policies</text>
    <text x="420" y="131">Product inventory</text>
    <text x="420" y="176">Package scans</text>
  </g>

  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="407" cy="82" r="9" fill="#334155"/>
    <text x="407" y="86" fill="#ffffff">1</text>
    <circle cx="407" cy="127" r="9" fill="#334155"/>
    <text x="407" y="131" fill="#ffffff">2</text>
    <circle cx="407" cy="172" r="9" fill="#334155"/>
    <text x="407" y="176" fill="#ffffff">3</text>
    <circle cx="583" cy="106" r="9" fill="#4b70aa"/>
    <text x="583" y="110" fill="#ffffff">4</text>
    <circle cx="583" cy="133" r="9" fill="#4b70aa"/>
    <text x="583" y="137" fill="#ffffff">5</text>
    <circle cx="583" cy="160" r="9" fill="#4b70aa"/>
    <text x="583" y="164" fill="#ffffff">6</text>
