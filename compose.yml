name: dejacode

x-description: "Full DejaCode stack: all services, pre-built image, no checkout required"

services:
  db:
    image: docker.io/library/postgres:16.16
    env_file:
      - docker.env
    volumes:
      - db_data:/var/lib/postgresql/data/
      - ./data/postgresql:/docker-entrypoint-initdb.d/
    shm_size: "1gb"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.io/library/redis:8.10.3-alpine
    # Enable redis data persistence using the "Append Only File" with the
    # default policy of fsync every second. See https://redis.io/topics/persistence
    command: redis-server --appendonly yes --loglevel warning
    volumes:
      - redis_data:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ghcr.io/aboutcode-org/dejacode:v6.1.0
    command: sh -c "
        ./manage.py migrate &&
        ./manage.py collectstatic --no-input --verbosity 0 --clear &&
        gunicorn dejacode.wsgi:application --bind :8000 --timeout 600 \
          --workers ${GUNICORN_WORKERS:-4} --worker-tmp-dir /dev/shm"
    env_file:
      - docker.env
    expose:
      - 8000
    volumes:
      - .env:/opt/dejacode/.env
      - static:/var/dejacode/static
      - media:/var/dejacode/media
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started

  worker:
    image: ghcr.io/aboutcode-org/dejacode:v6.1.0
    # Ensure that potential db migrations run first by waiting until "web" is up
    command: wait-for-it --strict --timeout=180 web:8000 -- sh -c "
      ./manage.py rqworker-pool --num-workers 2 --verbosity 1"
    env_file:
      - docker.env
    volumes:
      - .env:/opt/dejacode/.env
      # The media volume is required to access uploaded files from the worker
      - media:/var/dejacode/media
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  scheduler:
    image: ghcr.io/aboutcode-org/dejacode:v6.1.0
    command: wait-for-it web:8000 -- sh -c "./manage.py rqcron dje.cron_jobs"
    env_file:
      - docker.env
    volumes:
      - .env:/opt/dejacode/.env
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

  nginx:
    image: docker.io/library/nginx:1.31.9-alpine-slim
    ports:
      - "${NGINX_PUBLISHED_HTTP_PORT:-80}:80"
      - "${NGINX_PUBLISHED_HTTPS_PORT:-443}:443"
    volumes:
      - ./etc/nginx/conf.d/:/etc/nginx/conf.d/
      - static:/var/dejacode/static/
      - webroot:/var/www/html/
    depends_on:
      web:
        condition: service_started
    restart: always

  clamav:
    image: docker.io/clamav/clamav:1.5.4_base-debian13-slim
    volumes:
      - clamav_data:/var/lib/clamav
      - media:/var/dejacode/media
    restart: always

volumes:
  db_data:
  redis_data:
  clamav_data:
  static:
  media:
  webroot:
